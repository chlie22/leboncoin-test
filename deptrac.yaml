# Dependency rules of docs/conception.md §5.2, checked by `make lint`.
# Run with --fail-on-uncovered: a dependency on a class outside every layer fails,
# PHP internal classes excepted (ignore_uncovered_internal_classes, true by default).
deptrac:
  paths:
    - ./src
  cache_file: var/cache/.deptrac.cache
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/FizzBuzz/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/FizzBuzz/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/FizzBuzz/Infrastructure/.*
    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*
    - name: PsrLog
      collectors:
        - type: classLike
          value: ^Psr.Log.LoggerInterface$
    - name: Framework
      collectors:
        - type: classLike
          value: ^Symfony.*
        - type: classLike
          value: ^Doctrine.*
        - type: classLike
          value: ^Monolog.*
        # Every PSR interface except LoggerInterface, which belongs to PsrLog only.
        - type: classLike
          value: ^Psr.(?!Log.LoggerInterface$).*
  ruleset:
    Domain: ~
    Application:
      - Domain
      - PsrLog
    Infrastructure:
      - Application
      - Domain
      - Framework
      - PsrLog
    Shared:
      - Framework
      - PsrLog
