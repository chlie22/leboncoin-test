; Réglages de production (docs/conception.md §7.5), chargés après zz-app.ini.
; OPcache est intégré à PHP 8.5 : aucune ligne zend_extension.
opcache.validate_timestamps = 0
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data
realpath_cache_ttl = 600
expose_php = Off
display_errors = Off
