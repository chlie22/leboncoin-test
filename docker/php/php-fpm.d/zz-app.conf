; Pool PHP-FPM (docs/conception.md §7.5). Ordre alphabétique : chargé après docker.conf et www.conf,
; mais avant zz-docker.conf de l'image, qui fixe listen et daemonize : ne pas les redéfinir ici.
[www]
pm = static
; Valeur provisoire : à dimensionner avec la mémoire mesurée d'un processus (§9.4, étape 9b).
pm.max_children = 8
pm.max_requests = 500
; Inférieur au fastcgi_read_timeout de Nginx (15 s) : FPM tranche en premier.
request_terminate_timeout = 10s
ping.path = /ping
; docker.conf envoie le log d'accès FPM sur stderr, et son format par défaut (%r) contient la query string,
; donc str1 et str2 (§8.1). Le log d'accès est tenu par Nginx.
access.log = /dev/null
