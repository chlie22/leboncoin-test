# En-têtes communs à toutes les réponses (docs/conception.md §7.3). Nginx est la seule source de Cache-Control.
# Une location qui déclare son propre add_header n'hérite plus de ceux du server : y inclure ce fichier.
add_header X-Request-Id $request_id always;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control no-store always;
