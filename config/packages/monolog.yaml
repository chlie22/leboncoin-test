# Observability: JSON on stderr, request_id via RequestIdProcessor (docs/conception.md §8.1, §10).
monolog:
    channels:
        - deprecation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: 'php://stderr'
                level: debug
                formatter: monolog.formatter.json
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: test
                level: debug
                channels: ['!event']

# Prod: warning and above only (docs/conception.md §8.1). Deprecations are emitted at info level,
# so they are not written in prod; they stay visible in dev, test and CI.
when@prod:
    monolog:
        handlers:
            main:
                type: stream
                path: 'php://stderr'
                level: warning
                formatter: monolog.formatter.json
                channels: ['!deprecation']
