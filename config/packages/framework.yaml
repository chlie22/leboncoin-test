# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    exceptions:
        App\FizzBuzz\Application\Exception\StatisticsStoreUnavailable:
            status_code: 503
        App\FizzBuzz\Domain\Exception\InvalidFizzBuzzParameters:
            status_code: 500
        # Client errors, not application faults: Nginx already logs status, path and request_id in its
        # access log (§8.1). Kept under the prod "warning" threshold so app logs only carry real alerts.
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException:
            log_level: info
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
            log_level: info
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException:
            log_level: info

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
