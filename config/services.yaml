# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/FizzBuzz/Domain/FizzBuzzParameters.php'
            - '../src/FizzBuzz/Domain/Exception/'
            - '../src/FizzBuzz/Application/Exception/'
            - '../src/FizzBuzz/Application/Model/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # DBAL middleware, autoconfigured with the doctrine.middleware tag like SqliteConnectionPragmas (§6.5).
    Doctrine\DBAL\Driver\AbstractSQLiteDriver\Middleware\EnableForeignKeys: ~

    # STATS_WINDOW_SIZE as a raw string, checked by the factory: %env(int:)% would truncate "1.5" to 1 (§6.5).
    App\FizzBuzz\Infrastructure\Persistence\SqliteRequestStatisticsStore:
        factory: ['App\FizzBuzz\Infrastructure\Persistence\SqliteRequestStatisticsStore', 'withConfiguredWindowSize']
        arguments:
            $configuredWindowSize: '%env(STATS_WINDOW_SIZE)%'

    App\FizzBuzz\Application\Port\RequestStatisticsStore: '@App\FizzBuzz\Infrastructure\Persistence\SqliteRequestStatisticsStore'

    # Allow error bodies that embed invalid UTF-8 input (e.g. str1=%FF) to stay application/problem+json
    # instead of falling back to HTML when json_encode would fail (docs/conception.md §3.3, §4.4).
    # Flags: JSON_INVALID_UTF8_SUBSTITUTE (2097152) | JSON_PRESERVE_ZERO_FRACTION (1024).
    serializer.encoder.json:
        class: Symfony\Component\Serializer\Encoder\JsonEncoder
        arguments:
            $defaultContext:
                json_encode_options: 2098176
